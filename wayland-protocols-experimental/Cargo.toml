[package]
name = "wayland-protocols-experimental"
# Local path-patch version must match SCTK's crates.io pin so [patch] replaces it.
# Content includes xx preedit-start / protocol_compat ahead of upstream.
version = "20250721.0.1"
documentation = "https://docs.rs/wayland-protocols-experimental/"
repository = "https://github.com/smithay/wayland-rs"
authors = ["Elinor Berger <elinor@safaradeg.net>"]
license = "MIT"
keywords = ["wayland", "client", "server", "protocol", "extension"]
description = "Generated API for experimental wayland protocol extensions"
categories = ["gui", "api-bindings"]
edition = "2024"
rust-version = "1.86"
readme = "README.md"

[dependencies]
wayland-scanner = { version = "0.31.11" }
wayland-backend = { version = "0.3.15" }
wayland-client = { version = "0.31.14", optional = true }
wayland-server = { version = "0.31.14", optional = true }
wayland-protocols = { version = "0.32.13", features = ["unstable"] }
bitflags = "2"

[features]
client = ["dep:wayland-client", "wayland-protocols/client"]
server = ["dep:wayland-server", "wayland-protocols/server"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
